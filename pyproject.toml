[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simulation-crystal-lattice-formation"
version = "0.1.0"
description = "Simulation of Crystal Lattice Formation"
authors = [{ name = "Kate Novak" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

dependencies = [
    "numpy>=2.4.2",
    "matplotlib>=3.10.8",
]

[tool.setuptools.packages.find]
where = ["src"]
